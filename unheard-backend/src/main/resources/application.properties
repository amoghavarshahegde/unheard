# =============================================
# UNHEARD - Application Configuration
# =============================================
spring.application.name=unheard-backend
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/unheard_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Amogh@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# UNHEARD scoring weights (prototype defaults - see ScoringEngine.java for limitations)
unheard.scoring.verification.hazard-weight=0.35
unheard.scoring.verification.vulnerability-weight=0.30
unheard.scoring.verification.reporting-gap-weight=0.35
unheard.scoring.response.severity-weight=0.50
unheard.scoring.response.vulnerability-weight=0.30
unheard.scoring.response.unmet-need-weight=0.20

# Freshness thresholds (hours)
unheard.freshness.green-hours=6
unheard.freshness.yellow-hours=24

# Analysis
unheard.analysis.time-window-hours=24

# Logging
logging.level.com.unheard=INFO
