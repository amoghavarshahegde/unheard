version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentguard}
      POSTGRES_USER: ${POSTGRES_USER:-agentguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentguard_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentguard} -d ${POSTGRES_DB:-agentguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentguard-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agentguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-agentguard_secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  demo-agent:
    build:
      context: ./demo-agent
      dockerfile: Dockerfile
    container_name: agentguard-docbot
    restart: "no"
    environment:
      GATEWAY_URL: http://backend:8080/api/gateway/actions
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
    depends_on:
      - backend

volumes:
  pgdata:
